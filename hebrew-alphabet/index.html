section { margin-bottom:2.5rem; scroll-margin-top:1rem; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:1rem; }
figure { background:var(--card); border:1px solid var(--rule); border-radius:.85rem; overflow:hidden; }
figure img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:#000; }
figcaption { padding:.55rem .7rem .7rem; font-size:.92rem; color:var(--muted); }
